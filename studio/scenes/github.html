<!doctype html>
<html><head><meta charset="utf-8"><style>
:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--g:#8b949e;--g2:#c9d1d9;--red:#f85149;--green:#3fb950}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:#08090b;overflow:hidden;font-family:Inter,Segoe UI,system-ui,sans-serif;color:var(--g2)}
#wrap{position:absolute;inset:0;background:#08090b}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(circle at 50% 40%,#000 30%,transparent 80%)}
#demo{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.6);color:#fde68a;font-weight:700;letter-spacing:2px;padding:10px 24px;border-radius:10px;font-size:18px;opacity:0}
#col{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:1180px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:22px;opacity:0;transform:translateY(22px);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);font-size:17px}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.body{padding:20px 24px;font-size:19px;line-height:1.65}
.body h2{font-size:23px;margin-bottom:8px;color:#f0f6fc}
.body h3{font-size:18px;margin:14px 0 6px;color:#f0f6fc}
.body b{color:#f0f6fc}
.body code{font-family:ui-monospace,Menlo,monospace;background:#0d1117;padding:2px 7px;border-radius:6px;font-size:.92em;color:#79c0ff}
.body blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--g);margin:8px 0}
.body ol{padding-left:26px}.body li{margin:3px 0}.body sub{color:var(--g)}
.tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:1px;border-radius:6px;padding:4px 10px;margin-right:8px}
.sev-CRITICAL{background:rgba(248,81,73,.2);color:#ffa198;border:1px solid rgba(248,81,73,.5)}
.sev-HIGH{background:rgba(248,81,73,.12);color:#ff7b72}
.fileline{display:flex;align-items:center;gap:10px;font-family:ui-monospace,Menlo,monospace;font-size:15px;color:#79c0ff;padding:12px 20px;background:#0d1117;border-bottom:1px solid var(--line)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:16px;padding:12px 24px 14px;background:#161b22;color:#ffdcd7;border-left:3px solid var(--red)}
.ev{font-size:16px;color:var(--g);padding:0 24px 18px}.ev b{color:var(--g2)}
#banner2{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);font-size:18px;color:var(--g);opacity:0}
</style></head>
<body><div id="wrap"><div class="grid-bg"></div>

<script>
const PAYLOAD = {"event":"REQUEST_CHANGES","body":"## 🔷 PRISM Review — PR #184\n> **DEMO MODE** — generated against the bundled demonstration repository, not a live GitHub repository.\n\n**Recommendation: ⚠️ REQUEST CHANGES**\n\n**Risk: 63/100 (HIGH)**\n\n### Findings\n🟫 Critical: 1　🔴 High: 6　🟠 Medium: 5　🔵 Low: 1\n\n### Primary concerns\n1. Condition is always true — input validation cannot behave as written (`src/routes/members.ts:44`, CONFIRMED)\n2. Vulnerable dependency: lodash 4.17.20 (`package.json:15`, CONFIRMED)\n3. SQL query built from interpolated input (SQL injection) (`src/routes/members.ts:51`, CONFIRMED)\n4. Endpoint GET /api/orgs/:orgId/members is registered without authorization middleware (`src/routes/members.ts:16`, CONFIRMED)\n5. Endpoint POST /api/orgs/:orgId/members is registered without authorization middleware (`src/routes/members.ts:38`, CONFIRMED)\n\n### Tests\n⚠️ 3 changed behavior(s) missing regression tests — see the dashboard for generated test scenarios.\n\n### Static analysis\n✓ secret-scanner — 0 match(es)\n✓ rules-engine — 5 finding(s)\n○ semgrep — Semgrep not found on PATH — install to add community security ruleset coverage.\n○ eslint — ESLint not found on PATH — the bundled deterministic rules still run.\n○ tsc — No tsconfig.json in context bundle.\n\n### Risk explanation\n- Security: 1 critical security finding(s), e.g. \"SQL query built from interpolated input (SQL injection)\"\n- Security: 4 high security finding(s), e.g. \"Endpoint GET /api/orgs/:orgId/members is registered without authorization middleware\"\n- Correctness: 1 high correctness finding(s), e.g. \"Condition is always true — input validation cannot behave as written\"\n- Performance: 1 medium performance finding(s)\n- Dependencies: 1 high dependencies finding(s), e.g. \"Vulnerable dependency: lodash 4.17.20\"\n- Tests: 2 medium tests finding(s)\n\nFull evidence chains, code graph and critic decisions: [PRISM Dashboard](http://localhost:3000/reviews/rev_mu07z7ffodkiai)\n\n<sub>Findings are evidence-backed and adversarially verified. Confidence values indicate detector/model certainty, not scientific proof. React with 👎 on an inline comment or dismiss in the dashboard to teach PRISM repository conventions.</sub>","comments":[{"path":"src/routes/members.ts","line":51,"side":"RIGHT","body":"🟫 **CRITICAL — SQL query built from interpolated input (SQL injection)**\nA SQL statement is concatenated/interpolated with untrusted input. An attacker controlling that value can alter the query's structure — bypassing filters, reading or modifying arbitrary rows.\n**Evidence**\n- Interpolated query on added line: `src/routes/members.ts:51` — `SELECT id FROM members WHERE org_id = '${orgId}' AND user_id = '${userId}'`,\n- Detector: rules-engine/sql-injection: SQL keyword + taint marker (template interpolation / string concat / req.*)\n- Safe pattern: db.query(sqlText, [param1, param2]) — the driver escapes values as data, never as SQL syntax.\n**Recommendation**\nUse parameterized queries / bound parameters (e.g. db.query('... WHERE id = ?', [id])) or the ORM's criteria API. Never concatenate request data into SQL.\n```suggestion\n'SELECT id FROM members WHERE org_id = '?' + b + \"', [orgId]\",\n```\n<sub>Replaces interpolation with a positional placeholder and passes the value as a bound parameter.</sub>\n<sub>Critic-verified · deterministic · confidence 0.90 · PRISM</sub>"},{"path":"src/routes/members.ts","line":16,"side":"RIGHT","body":"🔴 **HIGH — Endpoint GET /api/orgs/:orgId/members is registered without authorization middleware**\nThe new route handler is reachable without the authentication/authorization middleware applied to surrounding API routes. Any caller — including unauthenticated ones — can invoke it.\n**Evidence**\n- Newly added unprotected route: `src/routes/members.ts:16` — membersRouter.get(\"/api/orgs/:orgId/members\", async (req, res) => {\n- Sibling routes enforce auth middleware: organizationsRouter.get(\"/api/orgs\", requireAuth, async (req: AuthenticatedRequest, res) => {\n- Detector: rules-engine/missing-route-auth: route registration with no auth middleware in a codebase that uses one\n**Recommendation**\nApply the shared authentication/authorization middleware before the handler (and require the specific role for sensitive operations, e.g. requireRole('admin')).\n```suggestion\nmembersRouter.get(\"/api/orgs/:orgId/members\", async (req, res) => {\n```\n<sub>Inserts the repository's authentication middleware before the route handler.</sub>\n<sub>Critic-verified · deterministic · confidence 0.90 · PRISM</sub>"},{"path":"src/routes/members.ts","line":38,"side":"RIGHT","body":"🔴 **HIGH — Endpoint POST /api/orgs/:orgId/members is registered without authorization middleware**\nThe new route handler is reachable without the authentication/authorization middleware applied to surrounding API routes. Any caller — including unauthenticated ones — can invoke it.\n**Evidence**\n- Newly added unprotected route: `src/routes/members.ts:38` — membersRouter.post(\"/api/orgs/:orgId/members\", async (req: AuthenticatedRequest, res) => {\n- Sibling routes enforce auth middleware: organizationsRouter.get(\"/api/orgs\", requireAuth, async (req: AuthenticatedRequest, res) => {\n- Detector: rules-engine/missing-route-auth: route registration with no auth middleware in a codebase that uses one\n**Recommendation**\nApply the shared authentication/authorization middleware before the handler (and require the specific role for sensitive operations, e.g. requireRole('admin')).\n```suggestion\nmembersRouter.post(\"/api/orgs/:orgId/members\", async (req: AuthenticatedRequest, res) => {\n```\n<sub>Inserts the repository's authentication middleware before the route handler.</sub>\n<sub>Critic-verified · deterministic · confidence 0.90 · PRISM</sub>"},{"path":"src/routes/members.ts","line":66,"side":"RIGHT","body":"🔴 **HIGH — Endpoint PATCH /api/orgs/:orgId/members/:userId is registered without authorization middleware**\nThe new route handler is reachable without the authentication/authorization middleware applied to surrounding API routes. Any caller — including unauthenticated ones — can invoke it.\n**Evidence**\n- Newly added unprotected route: `src/routes/members.ts:66` — membersRouter.patch(\"/api/orgs/:orgId/members/:userId\", async (req: AuthenticatedRequest, res) => {\n- Sibling routes enforce auth middleware: organizationsRouter.get(\"/api/orgs\", requireAuth, async (req: AuthenticatedRequest, res) => {\n- Detector: rules-engine/missing-route-auth: route registration with no auth middleware in a codebase that uses one\n**Recommendation**\nApply the shared authentication/authorization middleware before the handler (and require the specific role for sensitive operations, e.g. requireRole('admin')).\n```suggestion\nmembersRouter.patch(\"/api/orgs/:orgId/members/:userId\", async (req: AuthenticatedRequest, res) => {\n```\n<sub>Inserts the repository's authentication middleware before the route handler.</sub>\n<sub>Critic-verified · deterministic · confidence 0.90 · PRISM</sub>"},{"path":"src/routes/members.ts","line":29,"side":"RIGHT","body":"🟠 **MEDIUM — Query/request executed inside a loop (N+1 pattern)**\nA database query or remote call is awaited per iteration. For N items this issues N round-trips instead of one batched query, so latency grows linearly with collection size.\n**Evidence**\n- Loop begins on an added line: `src/routes/members.ts:29` — for (const member of members) {\n- Awaited query/request inside loop: `src/routes/members.ts` — const users = await db.query(\"SELECT * FROM users WHERE id = $1\", [member.user_id]);\n- Detector: rules-engine/n-plus-one: loop construct + await + query verb in the same block\n**Recommendation**\nCollect the IDs/keys and issue a single batched query (WHERE id IN (...)) / DataLoader, then join results back in memory.\n<sub>deterministic · confidence 0.82 · PRISM</sub>"},{"path":"src/routes/members.ts","line":31,"side":"RIGHT","body":"🔴 **HIGH — Sensitive field may be serialized into the API response**\nThe response spreads the full data row (or explicitly includes a credential field). Password hashes/tokens must never leave the service boundary, even hashed — they enable offline cracking and account takeover from a read-only API.\n**Evidence**\n- Added serialization: `src/routes/members.ts:31` — enriched.push({ ...member, profile: users[0] });\n- Sensitive field present in the same scope: `src/routes/members.ts` — password_hash: string;\n\"SELECT m.id, m.role, m.joined_at, u.id AS user_id, u.email, u.password_hash \" +\n- Data-exposure principle: Map rows to explicit response DTOs allowlisting safe fields.\n**Recommendation**\nReturn an explicit DTO that allowlists safe fields (id, name, role) and strips password_hash / tokens before serialization.\n<sub>Critic-verified · deterministic · confidence 0.80 · PRISM</sub>"},{"path":"src/routes/members.ts","line":44,"side":"RIGHT","body":"🔴 **HIGH — Condition is always true — input validation cannot behave as written**\nThe expression compares the same variable against two different constants combined with ||. A single value can never equal both constants, so the negated disjunction is always true. Every request hits (or never hits) this branch — in a role/state validator this rejects (or fails to reject) all input.\n**Evidence**\n- Tautological condition on added line: `src/routes/members.ts:44` — if (role !== \"admin\" || role !== \"member\") {\n- Truth-table check: 'admin' satisfies the second !== 'member'; 'member' satisfies the first !== 'admin' — every value passes.\n**Recommendation**\nUse AND for denylisting: if (role !== \"admin\" && role !== \"member\") { ... } — or prefer an allowlist: if (![\"admin\", \"member\"].includes(role)) { ... }\n```suggestion\nif (role !== \"admin\" && role !== \"member\") {\n```\n<sub>Swapping the boolean operator restores the intended validation truth table.</sub>\n<sub>Critic-verified · deterministic · confidence 0.96 · PRISM</sub>"},{"path":"src/routes/members.ts","line":38,"side":"RIGHT","body":"🟠 **MEDIUM — No tests cover new endpoint POST /api/orgs/:orgId/members**\nThe PR introduces/changes POST /api/orgs/:orgId/members in src/routes/members.ts with no co-located or graph-linked test suite. The scenarios below encode the regression cases PRISM expects; without them access-control and validation fixes can silently regress.\n**Evidence**\n- Changed behavior: `src/routes/members.ts:38` — POST /api/orgs/:orgId/members\n- Coverage check: Test files found: tests/organizations.test.ts — none target members\n- Code graph TESTS edges: 0 test suites link to src/routes/members.ts\n**Recommendation**\nAdd a members.test.ts suite covering:\n- unauthenticated request is rejected with 401\n- authenticated but unauthorized role is rejected with 403\n- malformed / missing required body fields return 400 with a clear error\n- duplicate submission (same payload twice) does not create duplicates\n- not-found target id returns 404 rather than 500\n- privilege escalation: a member cannot assign the owner/admin role\n- happy path returns the documented status code and response shape\n\nUse the \"Generate tests\" a\n<sub>deterministic · confidence 0.82 · PRISM</sub>"},{"path":"src/routes/members.ts","line":66,"side":"RIGHT","body":"🟠 **MEDIUM — No tests cover new endpoint PATCH /api/orgs/:orgId/members/:userId**\nThe PR introduces/changes PATCH /api/orgs/:orgId/members/:userId in src/routes/members.ts with no co-located or graph-linked test suite. The scenarios below encode the regression cases PRISM expects; without them access-control and validation fixes can silently regress.\n**Evidence**\n- Changed behavior: `src/routes/members.ts:66` — PATCH /api/orgs/:orgId/members/:userId\n- Coverage check: Test files found: tests/organizations.test.ts — none target members\n- Code graph TESTS edges: 0 test suites link to src/routes/members.ts\n**Recommendation**\nAdd a members.test.ts suite covering:\n- unauthenticated request is rejected with 401\n- authenticated but unauthorized role is rejected with 403\n- malformed / missing required body fields return 400 with a clear error\n- duplicate submission (same payload twice) does not create duplicates\n- not-found target id returns 404 rather than 500\n- privilege escalation: a member cannot assign the owner/admin role\n- happy path returns the documented status code and response shape\n\nUse the \"Generate tests\" a\n<sub>deterministic · confidence 0.82 · PRISM</sub>"},{"path":"src/routes/members.ts","line":38,"side":"RIGHT","body":"🟠 **MEDIUM — Mutating endpoint POST /api/orgs/:orgId/members reads request body without validation**\nThe handler consumes req.body without a schema/validation step. Undocumented fields, wrong types and missing required fields reach the data layer, producing 500s, bad persisted state and a contract that callers cannot rely on.\n**Evidence**\n- New mutating route: `src/routes/members.ts:38` — membersRouter.post(\"/api/orgs/:orgId/members\", async (req: AuthenticatedRequest, res) => {\n- req.body used in handler window: `src/routes/members.ts` — const userId = req.body.userId;\n- Validation markers scan: no zod/joi/yup/.parse()/validate/assert found within the handler window\n**Recommendation**\nDefine a request schema (e.g. zod) and parse req.body at the boundary; reject with 400 and field-level messages on failure.\n<sub>deterministic · confidence 0.78 · PRISM</sub>"},{"path":"src/routes/members.ts","line":66,"side":"RIGHT","body":"🟠 **MEDIUM — Mutating endpoint PATCH /api/orgs/:orgId/members/:userId reads request body without validation**\nThe handler consumes req.body without a schema/validation step. Undocumented fields, wrong types and missing required fields reach the data layer, producing 500s, bad persisted state and a contract that callers cannot rely on.\n**Evidence**\n- New mutating route: `src/routes/members.ts:66` — membersRouter.patch(\"/api/orgs/:orgId/members/:userId\", async (req: AuthenticatedRequest, res) => {\n- req.body used in handler window: `src/routes/members.ts` — const role = req.body.role;\n- Validation markers scan: no zod/joi/yup/.parse()/validate/assert found within the handler window\n**Recommendation**\nDefine a request schema (e.g. zod) and parse req.body at the boundary; reject with 400 and field-level messages on failure.\n<sub>deterministic · confidence 0.78 · PRISM</sub>"},{"path":"package.json","line":15,"side":"RIGHT","body":"🔴 **HIGH — Vulnerable dependency: lodash 4.17.20**\nPrototype pollution / command injection in lodash <4.17.21 (CVE-2021-23337). This PR introduces the vulnerable version.\n**Evidence**\n- Manifest entry: `package.json:15` — \"lodash\": \"4.17.20\" (dependencies)\n- Advisory match: Prototype pollution / command injection in lodash <4.17.21 — CVE-2021-23337; fixed in 4.17.21\n- Newly added in this PR: + \"lodash\": \"4.17.20\"\n**Recommendation**\nUpgrade lodash to 4.17.21 or later. Prefer an exact, pinned upgrade and refresh the lockfile in the same PR.\n<sub>Critic-verified · deterministic · confidence 0.95 · PRISM</sub>"}],"risk":{"score":63,"level":"HIGH","breakdown":{"security":92,"correctness":74,"performance":40,"maintainability":0,"testing":62,"scope":26,"dependencies":74},"reasons":["Security: 1 critical security finding(s), e.g. \"SQL query built from interpolated input (SQL injection)\"","Security: 4 high security finding(s), e.g. \"Endpoint GET /api/orgs/:orgId/members is registered without authorization middleware\"","Correctness: 1 high correctness finding(s), e.g. \"Condition is always true — input validation cannot behave as written\"","Performance: 1 medium performance finding(s)","Dependencies: 1 high dependencies finding(s), e.g. \"Vulnerable dependency: lodash 4.17.20\"","Tests: 2 medium tests finding(s)","Changes touch authentication boundary where defects have outsized impact"]}};
const params=new URLSearchParams(location.search);const DUR=parseFloat(params.get('dur')||'30');
const col=document.getElementById('col');
const stripEmoji = s => s
  .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{2190}-\u{21FF}\u{25A0}-\u{25FF}\u{2300}-\u{23FF}]/gu,'')
  .replace(/\s+/g,' ').trim();
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  return s;
}
function md(raw){
  const lines=raw.split('\n'); let out=''; let i=0; let list=null;
  const flush=()=>{ if(list!==null){out+='<ol style="padding-left:26px">'+list+'</ol>';list=null;} };
  for(;i<lines.length;i++){
    let l=lines[i];
    const m=l.match(/^(\d+)\.\s+(.*)$/);
    if(m){ if(list===null)list=''; list+='<li>'+inline(m[2])+'</li>'; continue; }
    flush();
    if(!l.trim()){continue;}
    if(l.startsWith('## ')){out+='<h2>'+inline(stripEmoji(l.slice(3)))+'</h2>';continue;}
    if(l.startsWith('### ')){out+='<h3>'+inline(l.slice(4))+'</h3>';continue;}
    if(l.startsWith('> ')){out+='<blockquote>'+inline(stripEmoji(l.slice(2)))+'</blockquote>';continue;}
    if(l.startsWith('- ')){out+='<div style="color:var(--g);font-size:18px;margin:3px 0">'+inline(l.slice(2))+'</div>';continue;}
    out+='<div style="margin:6px 0">'+inline(stripEmoji(l))+'</div>';
  }
  flush();
  return out;
}
// summary card
const sum=document.createElement('div');sum.className='card';sum.id='sum';
const bodyHtml = md(PAYLOAD.body
  .replace(/\n?<sub>[\s\S]*?<\/sub>/,'')
  .replace(/\n?Full evidence[\s\S]*?\)\n?/,'')
  .replace(/\n### (Static analysis|Risk explanation)[\s\S]*$/,''));
sum.innerHTML=`<div class="head"><div class="ava">P</div><b>prism-bot</b> reviewed this pull request <span style="color:var(--g)">· REQUEST CHANGES</span></div>
<div class="body">${bodyHtml}</div>`;
col.appendChild(sum);
// 3 inline comments: CRITICAL + 2 HIGH
const want=PAYLOAD.comments.slice(0,3);
const cards=[sum];
want.forEach((c,i)=>{
  const firstLine=stripEmoji(c.body.split('\n')[0].replace(/\*\*/g,'')).trim();
  const sev=(firstLine.match(/CRITICAL|HIGH|MEDIUM|LOW/)||[''])[0];
  const title=firstLine.replace(/^\s*(CRITICAL|HIGH|MEDIUM|LOW)\s*[—-]?\s*/,'');
  const evBlock=c.body.split('**Evidence**')[1]||'';
  const evLines=evBlock.split('\n').filter(x=>x.trim().startsWith('-')).slice(0,2)
    .map(x=>inline(x.replace(/^\s*-\s*/,''))).join('<br>');
  const codeMatch=c.body.match(/`(SELECT[\s\S]*?|[^`]*router\.[a-z]+[^`]*)`/);
  const d=document.createElement('div');d.className='card';d.id='c'+i;
  d.innerHTML=`<div class="head"><div class="ava" style="background:linear-gradient(135deg,#7c3aed,#ef4444)">P</div><b>prism-bot</b><span class="tag sev-${sev}">${sev}</span><span style="color:var(--g)">inline review comment</span></div>
  <div class="body" style="padding-bottom:6px"><h2 style="font-size:20px">${esc(title)}</h2></div>
  <div class="fileline">${c.path}:${c.line}</div>
  ${codeMatch?`<div class="code">${esc(codeMatch[1])}</div>`:''}
  <div class="ev"><b>Evidence</b><br>${evLines}</div>`;
  col.appendChild(d);cards.push(d);
});
const times=[.6, 7.5, 14, 20.5];
let start=null;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function f(ts){if(start===null)start=ts;const t=(ts-start)/1000;
  cards.forEach((c,i)=>{const e=ease(Math.max(0,Math.min(1,(t-times[i])/.7)));c.style.opacity=e;c.style.transform=`translateY(${(1-e)*22}px)`;});
  document.getElementById('demo').style.opacity=ease(Math.max(0,Math.min(1,(t-.3)/.6)));
  document.getElementById('banner2').style.opacity=ease(Math.max(0,Math.min(1,(t-23)/.8)))*.9;
  // slow scroll
  const max=Math.max(0,col.scrollHeight-900);
  col.style.transform=`translateX(-50%) translateY(${-Math.min(max,Math.max(0,(t-9)/17*max))}px)`;
  if(t<DUR+.4)requestAnimationFrame(f);
}
requestAnimationFrame(f);
</script></body></html>
