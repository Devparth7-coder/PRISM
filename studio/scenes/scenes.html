<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root{
    --bg:#08090b; --panel:#0e1013; --panel2:#14171c; --line:#23272f;
    --g1:#5a6170; --g2:#8b93a1; --g3:#c7ccd6; --white:#f5f5f6;
    --red:#ef4444; --red2:#b91c1c; --amber:#f59e0b; --green:#22c55e; --blue:#3b82f6;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:var(--sans);color:var(--g3)}
  #stage{position:absolute;inset:0}
  .grid-bg{position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(circle at 50% 45%,#000 30%,transparent 78%)}
  .vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .mono{font-family:var(--mono)}
  .panel{background:linear-gradient(180deg,#12151a,#0c0e12);border:1px solid var(--line);border-radius:14px}
  .chip{border:1px solid var(--line);background:#101318;border-radius:999px;padding:8px 18px;font-size:20px;letter-spacing:2px;font-weight:600;color:var(--g2)}
  .fade{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
  .kicker{font-size:15px;letter-spacing:6px;color:var(--red);font-weight:700;text-transform:uppercase}
  .big{font-weight:800;letter-spacing:-.02em;color:var(--white)}
  .edge{stroke:#3a4150;stroke-width:2;fill:none;stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset .8s ease}
  .edge.on{stroke-dashoffset:0}
  .edge.red{stroke:var(--red)} .edge.green{stroke:var(--green)} .edge.amber{stroke:var(--amber)}
  .node{border:1px solid var(--line);background:#101318;border-radius:12px;padding:12px 16px;font-size:17px;color:var(--g2);
    opacity:0;transform:scale(.92);transition:all .45s cubic-bezier(.2,.8,.2,1)}
  .node.on{opacity:1;transform:scale(1);border-color:#3a4150;color:var(--g3)}
  .node.hot{border-color:var(--red);color:var(--white);box-shadow:0 0 0 1px rgba(239,68,68,.35),0 0 34px rgba(239,68,68,.18)}
  .node.ok{border-color:rgba(34,197,94,.7);color:#bbf7d0}
  .pulse::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid currentColor;opacity:.5;animation:pulse 1.6s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.12);opacity:0}}
  .blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  /* vertical sizing */
  body.v{ }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const params = new URLSearchParams(location.search);
const SCENE = params.get("scene");
const DUR = parseFloat(params.get("dur") || "10");
const V = params.get("v") === "1";
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const $ = (s, r=document) => r.querySelector(s);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const ease = x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const seg = (t,a,b)=>clamp((t-a)/(b-a),0,1);
const scenes = {};
function register(name, fn){ scenes[name]=fn; }

/* ---------- shared chrome ---------- */
function chrome(){
  return `<div class="grid-bg"></div><div class="vignette"></div>`;
}
function mark(el, sel, on, at){
  const n = el.querySelector(sel);
  if(!n) return;
  const e = ease(at);
  n.style.opacity = on===false ? 1-e : e;
  n.style.transform = `translateY(${(1-e)*16}px)`;
}

/* ============================================================ TERMINAL */
register("terminal", (el,t)=>{
  const lines = [
    {at:1.0, text:'$ gh pr view 184 --json title,files,commits', cls:'cmd'},
    {at:2.6, text:'Add organization member management API', cls:'dim'},
    {at:3.6, text:'3 files changed · +90 −1 · commit b02f9e4', cls:'dim'},
    {at:5.0, text:'$ prism review --commit b02f9e4', cls:'cmd'},
    {at:6.4, text:'▸ snapshot pinned · context graph built · 9 stages', cls:'sys'},
  ];
  const diff = [
    ['@@ router.post("/orgs/:orgId/members") @@','h'],
    ['+ router.post(..., async (req,res) => {','a'],
    ['+   const { orgId } = req.params;','a'],
    ['+   const role = req.body.role;','a'],
    ['+   const rows = db.query(`SELECT id FROM members','a'],
    ["+     WHERE org_id = '${orgId}' AND role='${role}'`);",'crit'],
    ['+   res.json(rows);','a'],
  ];
  const findings = [
    {at:21.5, sev:'CRITICAL', txt:'SQL query built from interpolated input', file:'members.ts:51'},
    {at:23.5, sev:'HIGH', txt:'Endpoint registered without authorization middleware', file:'members.ts:38'},
    {at:25.2, sev:'HIGH', txt:'Condition is always true — validation cannot work', file:'members.ts:44'},
  ];
  el.innerHTML = chrome()+`
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
    <div id="term" class="panel" style="width:1180px;opacity:0;transition:opacity .6s">
      <div style="display:flex;gap:8px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)">
        <span style="width:12px;height:12px;border-radius:50%;background:#3a4150"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#3a4150"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:var(--red)"></span>
        <span class="mono" style="margin-left:12px;font-size:14px;color:var(--g1)">pull-request #184 — atlas/atlas-org-service</span>
      </div>
      <div class="mono" style="padding:22px 24px;font-size:19px;line-height:1.7;min-height:560px">
        ${lines.map((l,i)=>`<div id="l${i}" style="opacity:0;${l.cls==='cmd'?'color:#dfe4ec':l.cls==='sys'?'color:var(--amber)':'color:var(--g1)'}">${l.text}</div>`).join('')}
        <div id="diffbox" style="margin-top:18px;border:1px solid var(--line);border-radius:10px;overflow:hidden;opacity:0">
          <div style="background:#0b0d10;padding:10px 16px;color:var(--g1);font-size:15px">src/routes/members.ts</div>
          ${diff.map((d,i)=>`<div id="d${i}" class="diffline" style="opacity:0;white-space:pre;padding:1px 16px;color:${d[1]==='crit'?'#fecaca':'#dfe4ec'};background:${d[1]==='crit'?'rgba(239,68,68,.16)':d[1]==='a'?'rgba(34,197,94,.07)':'transparent'}">${d[0]}</div>`).join('')}
        </div>
        <div id="fbox" style="margin-top:16px"></div>
        <div id="cursor" class="blink mono" style="color:var(--red);opacity:0">▊</div>
      </div>
    </div>
  </div>`;
  const open = ease(seg(t,.2,.9));
  $('#term',el).style.opacity = open;
  $('#term',el).style.transform = `scale(${1.04-open*.04})`;
  lines.forEach((l,i)=>{
    const n=$('#l'+i,el); if(!n)return;
    const a=ease(seg(t,l.at,l.at+0.5));
    n.style.opacity=a; n.textContent = l.text.slice(0, Math.floor(l.text.length*ease(seg(t,l.at,l.at+0.9)))) + (i===lines.length-1?'':'');
  });
  const db = ease(seg(t,8.2,9));
  $('#diffbox',el).style.opacity=db;
  diff.forEach((d,i)=>{ const n=$('#d'+i,el); if(n) n.style.opacity=ease(seg(t,9+i*.55,9.6+i*.55)); });
  const fbox=$('#fbox',el);
  if(fbox.childElementCount===0){
    findings.forEach(f=>{
      const d=document.createElement('div');
      d.className='frow'; d.style.cssText='display:flex;gap:14px;align-items:center;margin-top:10px;padding:12px 16px;border:1px solid rgba(239,68,68,.4);border-radius:10px;background:rgba(239,68,68,.07);opacity:0;transform:translateX(-16px);transition:all .5s';
      d.innerHTML=`<span style="font-weight:800;font-size:15px;letter-spacing:1px;color:${f.sev==='CRITICAL'?'#fca5a5':'#fda4af'};min-width:96px">${f.sev}</span><span style="color:#f1f3f7">${f.txt}</span><span style="margin-left:auto;color:var(--g1);font-size:15px">${f.file}</span>`;
      fbox.appendChild(d);
    });
  }
  [...fbox.children].forEach((n,i)=>{ const a=ease(seg(t,findings[i].at,findings[i].at+.5)); n.style.opacity=a; n.style.transform=`translateX(${(1-a)*-16}px)`; });
  const zoom = ease(seg(t,28,31));
  $('#term',el).style.transform=`scale(${1.04-open*.04 + zoom*.18})`;
  $('#term',el).style.boxShadow=`0 0 ${zoom*90}px rgba(239,68,68,${zoom*.25})`;
  // highlight crit line extra
  const dc=$('#d5',el); if(dc){dc.style.outline=`${zoom*2}px solid rgba(239,68,68,${zoom*.6})`;dc.style.outlineOffset='-2px';}
});

/* ============================================================ TITLE */
register("title",(el,t)=>{
  el.innerHTML=chrome()+`
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px">
    <div id="bar" style="width:0;height:3px;background:linear-gradient(90deg,transparent,var(--red),transparent)"></div>
    <div id="word" class="big" style="font-size:132px;letter-spacing:34px;padding-left:34px;opacity:0;transform:scale(.96)">PRISM</div>
    <div id="sub" style="font-size:23px;letter-spacing:9px;color:var(--g2);opacity:0;padding-left:9px">PULL REQUEST INTELLIGENCE &amp; REVIEW MESH</div>
    <div id="tag" class="kicker" style="color:var(--g3);letter-spacing:5px;font-size:21px;opacity:0">AI code review that understands your repository.</div>
  </div>`;
  const w=ease(seg(t,.3,1.1)); $('#word',el).style.opacity=w; $('#word',el).style.transform=`scale(${.96+w*.04})`;
  $('#bar',el).style.width=(ease(seg(t,.1,1.2))*520)+'px';
  $('#sub',el).style.opacity=ease(seg(t,1.1,1.8));
  $('#tag',el).style.opacity=ease(seg(t,2.0,2.7));
  el.style.opacity=1-ease(seg(t,DUR-.5,DUR));
});

/* ============================================================ PROBLEM */
register("problem",(el,t)=>{
  el.innerHTML=chrome()+`
  <div style="position:absolute;left:80px;top:90px" id="k" class="kicker fade">THE PROBLEM</div>
  <div style="position:absolute;left:80px;top:130px" class="big fade" id="h" style="font-size:54px;max-width:800px;line-height:1.15">A diff rarely tells the whole story.</div>
  <div style="position:absolute;left:700px;top:330px">
    <svg width="1150" height="640" style="overflow:visible">
      <line class="edge" id="e0" x1="250" y1="120" x2="520" y2="120"/>
      <line class="edge" id="e1" x1="720" y1="120" x2="920" y2="120"/>
      <line class="edge red" id="e2" x1="1080" y1="120" x2="1180" y2="120" marker-end="url(#a)"/>
      <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L8,5 L0,10 z" fill="#ef4444"/></marker></defs>
    </svg>
    <div id="c0" class="node fade" style="position:absolute;left:60px;top:72px;width:260px;text-align:center">THE DIFF</div>
    <div id="c1" class="node fade" style="position:absolute;left:460px;top:72px;width:260px;text-align:center">LIMITED CONTEXT</div>
    <div id="c2" class="node fade" style="position:absolute;left:860px;top:72px;width:260px;text-align:center;border-color:rgba(239,68,68,.5);color:#fecaca">FALSE POSITIVES</div>
    <div id="c3" class="node fade hot pulse" style="position:absolute;left:1110px;top:60px;width:240px;text-align:center">UNCERTAINTY</div>
  </div>
  <div id="files" style="position:absolute;left:120px;top:360px;width:560px"></div>
  <div id="cap" style="position:absolute;left:120px;bottom:120px;max-width:1600px;font-size:34px;line-height:1.5;color:var(--g3);opacity:0">
    Functions have callers. APIs have contracts. <span style="color:var(--white)">Authentication has boundaries.</span>
  </div>`;
  mark(el,'#k',true,seg(t,.2,.7));mark(el,'#h',true,seg(t,.5,1.2));mark(el,'#cap',true,seg(t,18,19));
  [['#c0',2],['#e0',3.2],['#c1',3.6],['#e1',6],['#c2',6.4],['#e2',9],['#c3',9.4]].forEach(([s,a])=>{
    const n=$(s,el);if(!n)return;const e=ease(seg(t,a,a+.7));
    if(s.startsWith('#e')){n.classList.toggle('on',e>0);n.style.opacity=e;}else{n.style.opacity=e;n.style.transform=`translateY(${(1-e)*14}px)`;}
  });
  // related files bloom around a diff card
  const rel=[
    {x:0,y:0,label:'src/routes/members.ts',hot:true},
    {x:-60,y:-150,label:'src/middleware/auth.ts'},
    {x:330,y:-120,label:'src/db/client.ts'},
    {x:300,y:120,label:'src/app.ts'},
    {x:-40,y:180,label:'src/routes/organizations.ts'},
    {x:420,y:0,label:'package.json'},
  ];
  const box=$('#files',el);
  if(box.childElementCount===0){
    rel.forEach((f,i)=>{
      const d=document.createElement('div');
      d.className='mono';
      d.style.cssText=`position:absolute;left:${f.x}px;top:${f.y}px;padding:12px 16px;border-radius:10px;border:1px solid ${f.hot?'rgba(239,68,68,.6)':'var(--line)'};background:${f.hot?'rgba(239,68,68,.08)':'#101318'};color:${f.hot?'#fecaca':'var(--g1)'};font-size:16px;opacity:0;transform:scale(.9);transition:all .5s;white-space:nowrap`;
      d.textContent=f.label; box.appendChild(d);
    });
  }
  [...box.children].forEach((n,i)=>{const e=ease(seg(t,11+i*.9,11.6+i*.9));n.style.opacity=e;n.style.transform=`scale(${.9+e*.1})`;});
  el.style.opacity=1-ease(seg(t,DUR-.5,DUR));
});

/* ============================================================ PIPELINE (architecture) */
register("pipeline",(el,t)=>{
  const stages=[
    ['GITHUB APP','webhook · HMAC verified',1.5],
    ['INGESTION','PR snapshot @ exact SHA',4.5],
    ['CONTEXT ENGINE','profile · graph · memory',7.5],
    ['DETERMINISTIC','rules · secrets · advisories',10.5],
    ['REVIEW AGENTS','seven specialists',13.5],
    ['ADVERSARIAL CRITIC','challenges HIGH / CRITICAL',22],
    ['EVIDENCE VERIFIER','grounding · dedupe',26],
    ['RISK ENGINE','0–100 weighted score',29.5],
    ['SYNTHESIS & PUBLISH','inline + summary review',32.5],
  ];
  el.innerHTML=chrome()+`
  <div style="position:absolute;left:80px;top:64px" class="kicker fade" id="k">ARCHITECTURE</div>
  <div id="h" class="big fade" style="position:absolute;left:80px;top:100px;font-size:46px">Deterministic first. Grounded AI second. Verified always.</div>
  <svg id="svg" width="1920" height="1080" style="position:absolute;inset:0;overflow:visible"></svg>
  <div id="layers"></div>`;
  mark(el,'#k',true,seg(t,.2,.6));mark(el,'#h',true,seg(t,.4,1.1));
  const svg=$('#svg',el);
  const X=840;
  // vertical positions: stages 0..3 compact, agents hub at 4, fan row, then 5..8
  const Y=[232,296,360,424,488, 690,754,818,882];
  const fanY=572;
  let svgHtml='';
  for(let i=0;i<4;i++){
    svgHtml+=`<line class="edge" id="sp${i}" x1="${X}" y1="${Y[i]+46}" x2="${X}" y2="${Y[i+1]-10}"/>`;
  }
  svgHtml+=`<line class="edge" id="sp4" x1="${X}" y1="${Y[4]+40}" x2="${X}" y2="${fanY-14}"/>`;
  svgHtml+=`<line class="edge green" id="sp5" x1="${X}" y1="${fanY+44}" x2="${X}" y2="${Y[5]-12}"/>`;
  for(let i=5;i<stages.length-1;i++){
    svgHtml+=`<line class="edge" id="sp${i}" x1="${X}" y1="${Y[i]+46}" x2="${X}" y2="${Y[i+1]-10}"/>`;
  }
  for(let i=0;i<7;i++){
    const axc=X-450+i*150;
    svgHtml+=`<line class="edge" id="fa${i}" x1="${X}" y1="${fanY-40}" x2="${axc}" y2="${fanY-10}"/>`;
    svgHtml+=`<line class="edge green" id="fb${i}" x1="${axc}" y1="${fanY+42}" x2="${X}" y2="${Y[5]-12}"/>`;
  }
  svg.innerHTML=svgHtml;
  const layers=$('#layers',el);
  if(layers.childElementCount===0){
    stages.forEach(([name,sub],i)=>{
      if(name==='REVIEW AGENTS') return;
      const d=document.createElement('div');
      d.className='node'; d.id='st'+i;
      d.style.cssText=`position:absolute;left:${X-230}px;top:${Y[i]}px;width:460px;text-align:center`;
      d.innerHTML=`<div style="font-weight:700;color:var(--white);font-size:19px;letter-spacing:1px">${name}</div><div style="font-size:13px;color:var(--g1);margin-top:2px">${sub}</div>`;
      layers.appendChild(d);
    });
    const agents=['SECURITY','BUGS','PERF','TESTS','MAINT','API','DEPS'];
    agents.forEach((a,i)=>{
      const d=document.createElement('div');
      d.className='node'; d.id='ag'+i;
      const ax=X-505+i*150;
      d.style.cssText=`position:absolute;left:${ax}px;top:${fanY}px;width:110px;text-align:center;font-size:13px;font-weight:700;letter-spacing:1px;padding:10px 6px`;
      d.textContent=a; layers.appendChild(d);
    });
    const lab=document.createElement('div');
    lab.className='node hot pulse'; lab.id='st4';
    lab.style.cssText=`position:absolute;left:${X-230}px;top:${Y[4]}px;width:460px;text-align:center;padding:10px`;
    lab.innerHTML='<div style="font-weight:700;color:#fff;font-size:18px;letter-spacing:1px">REVIEW AGENTS · seven specialists</div>';
    layers.appendChild(lab);
  }
  stages.forEach((s,i)=>{
    const n=$('#st'+i,el); if(n){const e=ease(seg(t,s[2],s[2]+.6));n.style.opacity=e;n.style.transform=`translateY(${(1-e)*10}px)`;n.classList.toggle('on',e>.1);}
    if(i<stages.length-1){const sp=$('#sp'+i,el);if(sp){sp.classList.toggle('on',t>s[2]+.8);}}
  });
  for(let i=0;i<7;i++){
    const a=ease(seg(t,15+i*.5,15.4+i*.5));
    const fa=$('#fa'+i,el),fb=$('#fb'+i,el),ag=$('#ag'+i,el);
    if(fa){fa.style.opacity=a;fa.classList.toggle('on',a>.1);}
    if(ag){ag.style.opacity=a;ag.style.transform=`scale(${.9+a*.1})`;ag.classList.toggle('on',a>.1);}
    const b=ease(seg(t,20.4,20.8)); if(fb){fb.style.opacity=b;fb.classList.toggle('on',b>.1);}
  }
  // critic emphasis
  const crit=$('#st5',el); if(crit){crit.classList.toggle('ok',t>22.6);crit.style.boxShadow=t>22.6?'0 0 34px rgba(34,197,94,.18)':'';}
  el.style.opacity=1-ease(seg(t,DUR-.6,DUR));
});

/* ============================================================ WEBHOOK / COMMITS */
register("webhook",(el,t)=>{
  el.innerHTML=chrome()+`
  <div class="kicker fade" id="k" style="position:absolute;left:80px;top:70px">GITHUB INTEGRATION</div>
  <div id="cards" style="position:absolute;inset:180px 100px"></div>`;
  mark(el,'#k',true,seg(t,.2,.7));
  const box=$('#cards',el);
  const items=[
    {at:1, kind:'event', head:'pull_request · opened', mono:'delivery 7f3c…9a2 · HMAC-SHA256 ✓', note:'verified & persisted'},
    {at:5, kind:'job', head:'job review-pr · queued', mono:'dedupe key  review:pr-184:b02f9e4', note:'idempotent per commit'},
    {at:9, kind:'sha', head:'review pinned to commit', mono:'b02f9e4…002  →  review #1 · risk 63', note:'REQUEST CHANGES'},
    {at:15, kind:'push', head:'pull_request · synchronize', mono:'new commit c33d71a…003', note:'author pushed a fix'},
    {at:19, kind:'sha2', head:'review #2 · same pull request', mono:'c33d71a…003  →  review #2 · risk 3', note:'APPROVE · 13 findings fixed'},
  ];
  if(box.childElementCount===0){
    items.forEach((it,i)=>{
      const d=document.createElement('div');
      d.style.cssText=`position:absolute;left:${i%2?520:40}px;top:${Math.floor(i/2)*250}px;width:${i===4?980:470}px;padding:26px 30px;opacity:0;transform:translateY(18px);transition:all .6s`;
      d.className='panel';
      d.id='w'+i;
      const color=it.kind.startsWith('sha2')?'#bbf7d0':it.kind==='push'?'#fde68a':it.kind==='event'?'#dfe4ec':'#dfe4ec';
      d.innerHTML=`<div style="font-size:24px;font-weight:700;color:var(--white)">${it.head}</div>
        <div class="mono" style="font-size:16px;color:var(--g2);margin-top:10px">${it.mono}</div>
        <div style="margin-top:12px;font-size:15px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:${color}">${it.note}</div>`;
      box.appendChild(d);
    });
  }
  items.forEach((it,i)=>{const n=$('#w'+i,el);if(!n)return;const e=ease(seg(t,it.at,it.at+.6));n.style.opacity=e;n.style.transform=`translateY(${(1-e)*18}px)`;});
  el.style.opacity=1-ease(seg(t,DUR-.6,DUR));
});

/* ============================================================ CONTEXT GRAPH */
register("context",(el,t)=>{
  const nodes=[
    {id:'changed',x:720,y:420,label:'POST /orgs/:orgId/members',sub:'changed function · members.ts',hot:true},
    {id:'route',x:720,y:180,label:'routes/organizations.ts',sub:'caller'},
    {id:'app',x:300,y:180,label:'app.ts',sub:'router registration'},
